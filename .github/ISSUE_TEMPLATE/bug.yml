name: Bug report
description: Report a reproducible problem with the ferric CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ferric.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output from ferric version.
      placeholder: ferric v0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior. Remove credentials first.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed credentials, tokens, and private URLs from this report.
          required: true
